name: Build and push image

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/ennui2342/allsky-meteors

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate image tag
        id: tag
        run: echo "tag=1.$(date +%Y%m%d).${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy notification: see the "CI deploy notifications" standard in the
  # global Claude Code instructions.
  notify:
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TAG: ${{ needs.build.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK not set — skipping notification"
            exit 0
          fi
          if [ "$FAILED" = "true" ]; then
            payload=$(jq -n --arg url "$RUN_URL" --arg br "$BRANCH" \
              '{embeds:[{title:"❌ allsky-meteors build failed",description:("Push to `\($br)` failed — no deployment. [View logs](\($url))"),color:15158332,footer:{text:"github.com/ennui2342/allsky-meteors"}}]}')
          else
            payload=$(jq -n --arg tag "$TAG" \
              '{embeds:[{title:"✅ allsky-meteors deployed",description:"Image tag `\($tag)` pushed — Flux will reconcile shortly.",color:3066993,footer:{text:"github.com/ennui2342/allsky-meteors"}}]}')
          fi
          curl -sf -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d "$payload"
